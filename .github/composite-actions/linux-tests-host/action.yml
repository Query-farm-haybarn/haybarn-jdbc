name: 'Linux Tests Host'
description: 'Linux test run in host OS'

runs:
  using: "composite"
  steps:
    - name: Setup JDK
      uses: actions/setup-java@v6
      with:
        distribution: 'corretto'
        java-version: '27'

    - name: Tests Host
      shell: bash
      run: |
        cat /etc/os-release
        java -version
        java                                                \
          -cp ./build/release/haybarn_jdbc_tests.jar:./build/release/haybarn_jdbc.jar \
          farm.query.haybarn.TestDuckDBJDBC

    - name: Arrow Tests Host
      shell: bash
      run: |
        ./src/test/external/test_arrow.sh
