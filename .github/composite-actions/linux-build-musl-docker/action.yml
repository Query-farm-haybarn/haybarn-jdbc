name: 'Linux Build Musl Docker'
description: 'Linux musl-libc build in Alpine, matching the Haybarn engine musl recipe'

runs:
  using: "composite"
  steps:
    - name: Build
      shell: bash
      run: |
        # Match the Haybarn engine's musl build (LinuxRelease.yml): plain
        # alpine:3.22, mounted at the same absolute path inside and outside the
        # container (-v$PWD:$PWD), built with `make -C $PWD`. The pypa
        # musllinux_1_2 images we used previously failed `make -C /duckdb` on the
        # CI runners; the engine's alpine recipe builds musl binaries reliably in
        # the same environment, so we align with it. alpine:3.22 is multi-arch,
        # so the same image serves amd64 and arm64 runners. Alpine ccache 4.11.3
        # has http-storage, so the R2 remote cache works without the upstream
        # musl-static download.
        export PWD=$(pwd)
        docker run \
          -v"$PWD:$PWD" \
          -e GEN=ninja \
          -e CC='ccache gcc' -e CXX='ccache g++' \
          -e CCACHE_DIR="$PWD/ccache" \
          -e CCACHE_BASEDIR="$PWD" \
          -e CCACHE_NOHASHDIR=1 \
          -e CCACHE_SLOPPINESS=time_macros,include_file_mtime,pch_defines \
          -e CCACHE_COMPILERCHECK=content \
          -e CCACHE_REMOTE_STORAGE \
          -e JAVA_HOME=/usr/lib/jvm/java-8-openjdk \
          alpine:3.22 \
          sh -c "
            set -e
            apk add ccache cmake curl g++ git make openjdk8-jdk samurai
            ccache --version
            git config --global --add safe.directory '$PWD'
            test -f '$PWD/Makefile'
            make -C '$PWD' release
            ccache -s
          "
